<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanishgar M | Software Engineer & Competitive Programmer</title>
  <meta name="description" content="React SPA personal hub of Kanishgar M - One-click Copy & Open for LinkedIn, GitHub, LeetCode, Codeforces, GFG, with live Excel progress tracker.">
  
  <!-- Inter & Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- SheetJS for Client-Side Excel (.xlsx) Parsing & Preview -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- React 18 & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (runs JSX seamlessly in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- React SPA Mount Point -->
  <div id="root">
    <!-- Initial Loading State -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: #475569; font-family: 'Inter', sans-serif;">
      <div style="width: 42px; height: 42px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="font-weight: 600; font-size: 1rem;">Loading Kanishgar's Hub...</p>
    </div>
  </div>

  <noscript>
    <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to view Kanishgar's React SPA.</p>
    </div>
  </noscript>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- React SPA Application Source -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
